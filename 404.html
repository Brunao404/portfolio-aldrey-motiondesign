<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Aldrey Ramos</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808; --text: #f2f0eb; --muted: #555; --accent: #ff3d00;
      --font-d: 'Syne', sans-serif; --font-b: 'Inter', sans-serif;
    }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-b);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* Noise de fundo */
    #noise {
      position: fixed; inset: 0;
      opacity: .03; pointer-events: none; z-index: 0;
    }

    .wrap {
      position: relative; z-index: 1;
      text-align: center;
      padding: 40px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }

    .num {
      font-family: var(--font-d);
      font-size: clamp(7rem, 22vw, 18rem);
      font-weight: 800;
      line-height: .85;
      letter-spacing: -.05em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(242,240,235,.1);
      user-select: none;
      animation: fade-in .8s ease both;
    }

    .title {
      font-family: var(--font-d);
      font-size: clamp(1.4rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -.03em;
      margin-top: -0.1em;
      animation: fade-in .8s ease .1s both;
    }
    .title span { color: var(--accent); }

    .sub {
      font-size: clamp(.82rem, 1.4vw, .95rem);
      color: var(--muted);
      font-weight: 300;
      line-height: 1.7;
      max-width: 360px;
      margin-top: 20px;
      animation: fade-in .7s ease .2s both;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 40px;
      background: var(--accent); color: #fff;
      font-family: var(--font-d);
      font-size: .75rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      padding: 15px 32px; border-radius: 100px;
      text-decoration: none;
      transition: background .25s, transform .25s;
      animation: fade-in .7s ease .35s both;
    }
    .btn:hover { background: #ff5520; transform: scale(1.04); }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    /* Linha decorativa laranja */
    .line {
      width: 40px; height: 2px;
      background: var(--accent);
      margin-top: 32px;
      animation: fade-in .6s ease .45s both;
    }
  </style>
</head>
<body>

<canvas id="noise" aria-hidden="true"></canvas>

<div class="wrap">
  <p class="num" aria-hidden="true">404</p>
  <h1 class="title">Página <span>não encontrada</span></h1>
  <p class="sub">Esse endereço não existe ou foi movido. Volta pro portfólio e continua explorando.</p>
  <a href="/" class="btn">← Voltar ao início</a>
  <div class="line" aria-hidden="true"></div>
</div>

<script>
  /* Noise */
  (function () {
    const c = document.getElementById('noise');
    const ctx = c.getContext('2d');
    function resize() { c.width = innerWidth; c.height = innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    (function draw() {
      const img = ctx.createImageData(c.width, c.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255 | 0;
        d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      requestAnimationFrame(draw);
    })();
  })();
</script>
</body>
</html>
